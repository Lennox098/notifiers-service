# =============================================
# Spring Boot
# =============================================
spring.application.name=notifiers-service
# Render inyecta la variable PORT; en local se usa 8082
server.port=${PORT:8082}

# ---------------------------------------------------------------------------
# IMPORTANTE: las llaves NO se escriben aqui. En Render se definen como
# variables de entorno y Spring las aplica automaticamente sobre estas claves:
#   BREVO_API_KEY -> brevo.api-key, KAFKA_PASSWORD -> kafka.password, etc.
# ---------------------------------------------------------------------------

# =============================================
# Brevo (API HTTP) - Paso 4
# BREVO_API_KEY (xkeysib-...), BREVO_FROM_ADDRESS (remitente verificado), BREVO_FROM_NAME
# =============================================
brevo.base-url=https://api.brevo.com
brevo.api-key=
brevo.from-address=
brevo.from-name=Gestion de Usuarios

# =============================================
# Kafka (Aiven) - Paso 3: consumidor del topico notificaciones
# KAFKA_BOOTSTRAP_SERVERS, KAFKA_USERNAME, KAFKA_PASSWORD, KAFKA_CA_CERT (contenido PEM del ca.pem)
# =============================================
kafka.topic=notificaciones
kafka.group-id=notifiers
kafka.bootstrap-servers=localhost:9092
kafka.security-protocol=SASL_SSL
kafka.sasl-mechanism=SCRAM-SHA-256
kafka.username=
kafka.password=
kafka.ca-cert=

spring.kafka.bootstrap-servers=${kafka.bootstrap-servers}
spring.kafka.security.protocol=${kafka.security-protocol}
spring.kafka.properties.sasl.mechanism=${kafka.sasl-mechanism}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${kafka.username}" password="${kafka.password}";
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-certificates=${kafka.ca-cert}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# La primera vez lee desde el inicio del topico; despues continua donde quedo (aunque Render lo duerma)
spring.kafka.consumer.auto-offset-reset=earliest
